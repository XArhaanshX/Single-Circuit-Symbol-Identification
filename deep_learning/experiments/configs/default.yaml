# Deep Learning Branch — Siamese Semantic Verification
# Default Experiment Configuration

experiment:
  name: "siamese_verification_v1"
  seed: 42

data:
  target_size: [64, 64]
  positive_top_k: 3
  negative_start_rank: 8
  augmentations_per_positive: 15
  augmentations_per_negative: 10
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15

model:
  backbone: "TinyCNN"        # or "ResNet18"
  embedding_dim: 64
  similarity: "cosine"       # or "euclidean"
  dropout: 0.3

training:
  phase1_epochs: 8
  phase2_epochs: 12
  phase1_lr: 0.001
  phase2_lr: 0.0001
  weight_decay: 0.0001
  batch_size: 16
  triplet_margin: 0.5
  n_triplets: 200
  mining_strategy: "semihard"  # hardest, semihard, all
  collapse_threshold: 0.01
  snapshot_epochs: [1, 5, 10]

retrieval:
  k_values: [1, 3, 5, 10]

fusion:
  chamfer_weight: 0.45
  pca_weight: 0.25
  siamese_weight: 0.30
